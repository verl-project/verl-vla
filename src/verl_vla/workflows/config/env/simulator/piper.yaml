# Target class instantiated from this configuration.
_target_: verl_vla.envs.piper.config.PiperConfig

# Simulator backend selected by EnvWorker.
simulator_type: piper

# Physical arms in flat action/state order. Keep one item for single-arm
# operation or both for dual-arm operation.
arms:

  # First logical teleoperation hand.
  - name: left

    # SocketCAN interface connected to this arm.
    can_channel: can_left

    # AgileX driver and URDF model: piper, piper_h, piper_l, or piper_x.
    model: piper_x

    # pyAgxArm Piper firmware adapter.
    firmware_version: v188

    # Reset action: six joint radians followed by gripper width in meters.
    # Null captures the complete seven-dimensional startup action instead.
    initial_action: [0.00010472, -0.00069813, 0.01808161, 0.59861303, 0.05106833, -0.02483604, 0.0]

  # Second logical teleoperation hand.
  - name: right

    # SocketCAN interface connected to this arm.
    can_channel: can_right

    # AgileX driver and URDF model: piper, piper_h, piper_l, or piper_x.
    model: piper_x

    # pyAgxArm Piper firmware adapter.
    firmware_version: v188

    # Reset action: six joint radians followed by gripper width in meters.
    # Null captures the complete seven-dimensional startup action instead.
    initial_action: [0.03506366, -0.00089012, 0.01935570, 0.38083084, 0.01144936, 0.29564132, 0.0]

# V4L2 camera observations. Any number may be listed; [] disables cameras.
cameras:

  # Stable observation and LeRobot feature name.
  - name: height

    # V4L2 device path.
    device: /dev/v4l/by-id/usb-Sonix_Technology_Co.__Ltd._Dabai_DC1_CC1N16202MR-video-index0

    # Capture rate in frames per second.
    fps: 30

    # Captured image width in pixels.
    width: 320

    # Captured image height in pixels.
    height: 240

    # OpenCV/V4L2 capture format. Keep the verified native camera mode.
    fourcc: YUYV

    # Seconds of background capture before startup completes.
    warmup_s: 3

  # Stable observation and LeRobot feature name.
  - name: right_wrist

    # V4L2 device path.
    device: /dev/v4l/by-id/usb-Sonix_Technology_Co.__Ltd._Dabai_DC1_CC1N16200MD-video-index0

    # Capture rate in frames per second.
    fps: 30

    # Captured image width in pixels.
    width: 320

    # Captured image height in pixels.
    height: 240

    # OpenCV/V4L2 capture format. Keep the verified native camera mode.
    fourcc: YUYV

    # Seconds of background capture before startup completes.
    warmup_s: 3

  # Stable observation and LeRobot feature name.
  - name: left_wrist

    # V4L2 device path.
    device: /dev/v4l/by-id/usb-Sonix_Technology_Co.__Ltd._Dabai_DC1_CC1N162035J-video-index0

    # Capture rate in frames per second.
    fps: 30

    # Captured image width in pixels.
    width: 320

    # Captured image height in pixels.
    height: 240

    # OpenCV/V4L2 capture format. Keep the verified native camera mode.
    fourcc: YUYV

    # Seconds of background capture before startup completes.
    warmup_s: 3

# Task string published in observations and recordings.
task_description: Put the white object into the box.

# Upstream AgileX URDF checkout used by Pinocchio FK/IK.
urdf_root: ${oc.env:XDG_DATA_HOME,${oc.env:HOME}/.local/share}/verl-vla/agx_arm_description/agx_arm_urdf

# Hardware startup feedback timeout.
startup_timeout_s: 10.0

# Direct joint control and reset rate.
control_hz: 30.0

# Optional Piper controller speed override. Null preserves QuestArm's previous
# behavior and pyAgxArm's effective 50% default.
speed_percent: null

# Joint-6 to TCP offset used by the hardware feedback path. This matches the
# upstream QuestArm driver used by the previous ROS backend.
driver_tcp_length: 0.13

# Joint-6 to TCP translation used by the QuestArm IK model, in meters.
tool_length: 0.1325

# Pinocchio/CasADi IK position objective weight.
ik_position_weight: 2.0

# IK orientation objective weight.
ik_orientation_weight: 2.0

# IK neutral-configuration regularization weight.
ik_regularization_weight: 0.01

# IK smoothing objective weight.
ik_smooth_weight: 0.1

# IPOPT maximum solve iterations.
ik_max_iterations: 50

# IPOPT convergence tolerance.
ik_tolerance: 1.0e-4

# Reject camera frames older than this many seconds.
camera_stale_timeout_s: 0.5

# Duration in seconds of the smooth joint reset trajectory.
reset_duration_s: 3.0

# Maximum time in seconds to wait for reset targets.
reset_timeout_s: 15.0

# Per-joint reset completion tolerance in radians.
reset_joint_tolerance: 0.03

# Gripper reset completion tolerance in meters.
reset_gripper_tolerance: 0.002

# Maximum gripper opening width in meters.
gripper_open_width: 0.1

# Minimum gripper opening width in meters.
gripper_close_width: 0.0

# Relative gripper width change per keyboard step in meters.
gripper_width_step: 0.005

# Gripper force passed directly to pyAgxArm, in newtons.
gripper_force: 1.0
